[project]
name = "agent-bridge-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "python-dotenv>=1,<2",
 "httpx>=0.28,<1",
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1,<2",
 "langgraph-checkpoint-sqlite>=3,<4",
 "langchain-openai>=1,<2", "langchain-anthropic>=1,<2",
 "langchain-google-genai>=4,<5", "langchain-ollama>=1,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=1,<2"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["agent_runtime*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
